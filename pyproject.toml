[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpletracker"
version = "0.1.0"
description = "Simple particle tracking with optional gap closing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
notebook = ["marimo>=0.25.1"]
test = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["simpletracker", "crossing_demo", "crossing_gaps"]
