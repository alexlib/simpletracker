[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpletracker"
version = "0.1.0"
description = "Simple particle tracking with optional gap closing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "marimo>=0.17.6",
    "matplotlib>=3.9.4",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebook = ["marimo>=0.10"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["simpletracker", "crossing_demo"]
